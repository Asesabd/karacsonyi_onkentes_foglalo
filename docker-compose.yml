services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xmas
      POSTGRES_PASSWORD: xmas
      POSTGRES_DB: xmas_booking
    ports:
      - "5432:5432"
    volumes:
      - xmas_postgres_data:/var/lib/postgresql/data

volumes:
  xmas_postgres_data:
